<!DOCTYPE html>
<html>
<head>
    <title>Flipkart</title>
    <link rel="stylesheet" href="flipkart.css">
</head>
<body>
    <nav class="head">
        <div class="sections">
            <a href="#" class="btn flipkart-btn">Flipkart</a>
            <a href="#" class="btn travel-btn">Travel</a>
        </div>
        <div class="location"> Location not set <a href="#" class="link">Select delivery location</a></div>
    </nav>

    <nav class="input">
        <div class="search-container">
            <input type="text" placeholder="Search for Products, Brands and More">
        </div>
        <div class="user">
            <a href="#" class="login">Login</a>
            <a href="#" class="login">More</a>
            <a href="#" class="login">Cart</a>
        </div>
    </nav>

    <nav class="images">
        <img src="first.jpg" alt="">
        <img src="sec.jpg" alt="">
        <img src="third.jpg" alt="">
    </nav>

    <section class="promo">
        <div class="promo-top">
            <div class="promo-title">Appliance for Cool Summer</div>
            <a href="#" class="promo-button">→</a>
        </div>
        <div class="promo-cards">
            <div class="promo-card">
                <img src="https://rukminim2.flixcart.com/image/300/300/xif0q/headphone/0/c/l/ultrapod-white-bullstorm-original-imah8ex3vpfwxehx.jpeg?q=90" alt="True Wireless">
                <div class="promo-text">
                    <span class="promo-tag">True Wireless</span>
                    <span class="promo-offer">Min. 50% Off</span>
                </div>
            </div>
            <div class="promo-card">
                <img src="https://rukminim2.flixcart.com/image/300/300/xif0q/headphone/x/o/r/-original-imah4gxg283tyubb.jpeg?q=90" alt="Neckband">
                <div class="promo-text">
                    <span class="promo-tag">Neckband</span>
                    <span class="promo-offer">Min. 50% Off</span>
                </div>
            </div>
            <div class="promo-card">
                <img src="https://rukminim2.flixcart.com/image/300/300/xif0q/trimmer/v/s/5/1-20-mm-all-rounder-2-in-1-beard-body-grooming-ceramic-cordless-original-imahdguqgystngms.jpeg?q=90" alt="Trimmers">
                <div class="promo-text">
                    <span class="promo-tag">Trimmers</span>
                    <span class="promo-offer">Min. 50% Off</span>
                </div>
            </div>
            <div class="promo-card">
                <img src="https://rukminim2.flixcart.com/image/300/300/xif0q/smartwatch/2/1/b/49-t800-silver-dial-silver-metal-strap-android-ios-qamanta-yes-original-imahgdr9t77jzfgg.jpeg?q=90" alt="Smart Watches">
                <div class="promo-text">
                    <span class="promo-tag">Smart Watches</span>
                    <span class="promo-offer">Min. 40% Off</span>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
